name: Keep Render API Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ThrdLoom API
        run: curl -s -o /dev/null -w "%{http_code}" https://thrdloom.onrender.com/get-categories